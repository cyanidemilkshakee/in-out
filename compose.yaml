services:
  postgres-primary:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-inout}
    ports:
      - "5432:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:inout@postgres-primary:5432/inout
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
    ports:
      - "8000:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    environment:
      - DATABASE_URL=postgresql://inout:inout@postgres-primary:5432/inout
      - PYTHON_API_URL=http://python-api:8000
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=dev_secret_key_for_testing
    ports:
      - "1001:1001"
    depends_on:
      postgres-primary:
        condition: service_healthy

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: inout
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pg-primary-data:

