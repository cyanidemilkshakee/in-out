services:
  postgres-primary:
    image: bitnami/postgresql:17
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${PG_REPL_PASSWORD:-repl_pass}
      - POSTGRESQL_USERNAME=inout
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-inout}
      - POSTGRESQL_DATABASE=inout
    ports:
      - "5432:5432"
    volumes:
      - pg-primary-data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:17
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${PG_REPL_PASSWORD:-repl_pass}
      - POSTGRESQL_MASTER_HOST=postgres-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    volumes:
      - pg-replica-data:/bitnami/postgresql

  pgbouncer:
    image: bitnami/pgbouncer:latest
    environment:
      - PGBOUNCER_DATABASE=inout
      - PGBOUNCER_PORT=6432
      - POSTGRESQL_HOST=postgres-primary
      - POSTGRESQL_USERNAME=inout
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-inout}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=1000
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "6432:6432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  step-ca:
    image: smallstep/step-ca:latest
    environment:
      - DOCKER_STEPCA_INIT_NAME=LocalCA
      - DOCKER_STEPCA_INIT_DNS_NAMES=localhost,step-ca
      - DOCKER_STEPCA_INIT_PASSWORD=${STEPCA_PASSWORD:-password}
    volumes:
      - step-ca-data:/home/step
    ports:
      - "9000:9000"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - "8474:8474"
      - "8475:8475"

  api-gateway:
    image: nginx:alpine
    ports:
      - "8443:8443"
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg-primary-data:
  pg-replica-data:
  step-ca-data:
