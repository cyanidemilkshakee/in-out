services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inout
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inout}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: inout
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://inout:${POSTGRES_PASSWORD:-inout}@db:5432/inout
      PGPOOL_MAX: 10
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1001:1001"
    restart: unless-stopped

volumes:
  postgres-data:
