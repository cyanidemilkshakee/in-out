services:
  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      READ_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
    networks: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      db-test:
        condition: service_healthy

  postgres-primary:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-inout}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-1003}:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-1004}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.2.5}
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres-primary:5432/inout
      - KC_DB_USERNAME=inout
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-inout}
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - INOUT_APP_URL=${AUTH_URL:-http://localhost:${APP_PORT:-1008}}
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-1005}
      - KC_HOSTNAME_ADMIN=http://localhost:${KEYCLOAK_PORT:-1005}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-1005}:8080"
    volumes:
      - ./keycloak/realm-inout.json:/opt/keycloak/data/import/inout-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-primary:
        condition: service_healthy

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:${POSTGRES_PASSWORD:-inout}@postgres-primary:5432/inout
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - ENV=production
      - MTLS_PROXY_SECRET=${MTLS_PROXY_SECRET:-}
      - KEYCLOAK_ISSUER=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:8080/realms/inout
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-300}
    ports:
      - "127.0.0.1:${PYTHON_API_PORT:-1002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:${PYTHON_API_PORT:-1002}
    environment:
      - DATABASE_URL=postgresql://inout:${POSTGRES_PASSWORD:-inout}@postgres-primary:5432/inout
      - PYTHON_API_URL=http://python-api:8000
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:${APP_PORT:-1008}}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - KEYCLOAK_CLIENT_ID=inout-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - KEYCLOAK_ISSUER=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:8080/realms/inout
      - KEYCLOAK_ISSUER_PUBLIC=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
    ports:
      - "127.0.0.1:${APP_PORT:-1008}:1001"
    depends_on:
      postgres-primary:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      python-api:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=inout
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-inout}
      - POSTGRES_SEEDS=postgres-primary
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-1006}:7233"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${APP_PORT:-1008}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-1007}:8080"
    depends_on:
      - temporal

volumes:
  pg-primary-data:

networks:
  test:
    internal: true
