services:
  postgres-primary:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-inout}
    ports:
      - "5432:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres-primary:5432/inout
      - KC_DB_USERNAME=inout
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-inout}
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME=http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-primary:
        condition: service_healthy

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:${POSTGRES_PASSWORD:-inout}@postgres-primary:5432/inout
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
      - MTLS_PROXY_SECRET=${MTLS_PROXY_SECRET:-}
      - KEYCLOAK_ISSUER=http://localhost:8081/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:8080/realms/inout
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    environment:
      - DATABASE_URL=postgresql://inout:${POSTGRES_PASSWORD:-inout}@postgres-primary:5432/inout
      - PYTHON_API_URL=http://python-api:8000
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:1001}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - KEYCLOAK_CLIENT_ID=inout-frontend
      - KEYCLOAK_CLIENT_SECRET=inout-frontend-secret
      - KEYCLOAK_ISSUER=http://localhost:8081/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:8080/realms/inout
      - KEYCLOAK_ISSUER_PUBLIC=http://localhost:8081/realms/inout
    ports:
      - "1001:1001"
    depends_on:
      postgres-primary:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      python-api:
        condition: service_healthy

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: inout
      POSTGRES_PASSWORD: inout
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=inout
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-inout}
      - POSTGRES_SEEDS=postgres-primary
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "7233:7233"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"
    depends_on:
      - temporal

volumes:
  pg-primary-data:
