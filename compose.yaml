# Kong owns the local HTTP listeners. App, API, and Keycloak have no host ports.
# For physical-terminal TLS, add compose.mtls.yaml with your own certificates.
services:
  kong:
    image: kong:${KONG_VERSION:-3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8002, 0.0.0.0:8005"
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: "127.0.0.1:8100"
      KONG_PLUGINS: bundled,inout-terminal-identity
      KONG_NGINX_MAIN_ENV: INOUT_TERMINAL_SECRET
      INOUT_TERMINAL_SECRET: ${KONG_TERMINAL_SECRET:-}
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 1m
      # Auth.js may chunk the session cookie across several request cookies.
      # Allow the gateway to accept the complete Cookie header on protected routes.
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 16k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 32k"
      # Auth.js/Keycloak can return several large Set-Cookie and redirect
      # headers during login. Keep these responses inside Kong's buffers.
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 16k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "8 16k"
      # Resolve upstream containers only after their health checks pass. This
      # avoids a first-request DNS failure when Docker has not registered the
      # app endpoint yet.
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./gateway/plugins/inout-terminal-identity:/usr/local/share/lua/5.1/kong/plugins/inout-terminal-identity:ro
    ports:
      - "127.0.0.1:${APP_PORT:-1008}:8000"
      - "127.0.0.1:${PYTHON_API_PORT:-1002}:8002"
      - "127.0.0.1:${KEYCLOAK_PORT:-1005}:8005"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      python-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      READ_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
    networks: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      db-test:
        condition: service_healthy

  postgres-primary:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-1003}:5432"
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-1004}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.2.5}
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres-primary:5432/inout
      - KC_DB_USERNAME=inout
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - KC_HTTP_PORT=1105
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - INOUT_APP_URL=${AUTH_URL:-http://localhost:${APP_PORT:-1008}}
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-1005}
      - KC_HOSTNAME_ADMIN=http://localhost:${KEYCLOAK_PORT:-1005}
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-inout.json:/opt/keycloak/data/import/inout-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-primary:5432/inout
      # Docker Desktop's host gateway reaches Temporal's published frontend
      # without the container-to-self gRPC routing timeout.
      - TEMPORAL_HOST=host.docker.internal:${TEMPORAL_PORT:-1006}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # One idempotent bootstrap job: schema, reference data, then the durable
    # Temporal alert schedule. Keeping these together avoids a second exited
    # scheduler container after every deployment.
    command: ["sh", "-c", "alembic upgrade head && python seed.py reference && python -m scheduler"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      temporal:
        condition: service_healthy

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-primary:5432/inout
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=host.docker.internal:${TEMPORAL_PORT:-1006}
      - ENV=production
      - KONG_TERMINAL_SECRET=${KONG_TERMINAL_SECRET:-}
      - KEYCLOAK_ISSUER=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_ADMIN_BASE=http://keycloak:1105
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-300}
      - PUBLIC_PORT=${PYTHON_API_PORT:-1002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:1102/health/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres-primary:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-primary:5432/inout
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=host.docker.internal:${TEMPORAL_PORT:-1006}
      - ENV=production
      - KEYCLOAK_ISSUER=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "temporal_worker"]
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHON_API_URL=http://kong:8002
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://localhost:${APP_PORT:-1008}}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - KEYCLOAK_CLIENT_ID=inout-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - KEYCLOAK_ISSUER=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_ISSUER_PUBLIC=http://localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - PORT=${APP_INTERNAL_PORT:-3000}
      - PUBLIC_PORT=${APP_PORT:-1008}
    depends_on:
      postgres-primary:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=inout
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_SEEDS=postgres-primary
      # Existing Temporal metadata advertises the active frontend at loopback.
      # Bind all interfaces so that route and Docker's published port both work.
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-1006}:7233"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: [observability]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:${APP_PORT:-1008}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-1007}:8080"
    depends_on:
      - temporal
    restart: unless-stopped

volumes:
  pg-primary-data:

networks:
  test:
    internal: true
