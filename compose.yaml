# Kong owns the private/local HTTP listeners. App, API, and Keycloak have no host ports.
# The optional compose.shared.yaml override adds Caddy as the public HTTPS edge.
services:
  kong:
    # Published loopback ports need a host-facing bridge. Upstreams stay private.
    networks: [edge, ingress, web, cache, monitoring]
    image: inout-kong:${KONG_VERSION:-3.9.3}
    build:
      context: ./gateway
      args:
        KONG_VERSION: ${KONG_VERSION:-3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "0.0.0.0:1012, 0.0.0.0:1013, 0.0.0.0:1014"
      KONG_ADMIN_LISTEN: "off"
      # Metrics are reachable only from private container networks; this port
      # is not published on the host or included in the public proxy listeners.
      KONG_STATUS_LISTEN: "0.0.0.0:1017"
      KONG_PLUGINS: bundled,inout-terminal-identity,inout-rate-identity
      KONG_NGINX_MAIN_ENV: "INOUT_TERMINAL_SECRET; env INOUT_GATEWAY_IDENTITY_SECRET; env INOUT_GATEWAY_REDIS_PASSWORD"
      INOUT_TERMINAL_SECRET: ${KONG_TERMINAL_SECRET:-}
      INOUT_GATEWAY_IDENTITY_SECRET: ${KONG_IDENTITY_SECRET:?Generate KONG_IDENTITY_SECRET}
      INOUT_GATEWAY_REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Generate REDIS_GATEWAY_PASSWORD}
      # Trust forwarded client IPs only from Caddy's isolated ingress address.
      # Direct localhost and other Docker-network callers still use their peer IP.
      KONG_TRUSTED_IPS: ${SHARED_CADDY_IP:-172.30.250.2}
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 1m
      KONG_NGINX_HTTP_CLIENT_BODY_TIMEOUT: ${INOUT_UPLOAD_IDLE_TIMEOUT_SECONDS:-30}s
      # Auth.js may chunk the session cookie across several request cookies.
      # Allow the gateway to accept the complete Cookie header on protected routes.
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 16k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 32k"
      # Auth.js/Keycloak can return several large Set-Cookie and redirect
      # headers during login. The entire response header block (not each
      # cookie) must fit the first buffer, including session chunks >16 KiB.
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 64k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "8 64k"
      # Resolve upstream containers only after their health checks pass. This
      # avoids a first-request DNS failure when Docker has not registered the
      # app endpoint yet.
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./gateway/plugins/inout-terminal-identity:/usr/local/share/lua/5.1/kong/plugins/inout-terminal-identity:ro
      - ./gateway/plugins/inout-rate-identity:/usr/local/share/lua/5.1/kong/plugins/inout-rate-identity:ro
    ports:
      - "127.0.0.1:${APP_PORT:-1008}:1012"
      - "127.0.0.1:${PYTHON_API_PORT:-1002}:1013"
      - "127.0.0.1:${KEYCLOAK_PORT:-1005}:1014"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    depends_on:
      app:
        condition: service_healthy
      python-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        # Refresh Kong's DNS cache when Compose recreates the identity service.
        restart: true
      redis:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: inout-postgres:17
    build: {context: ./infrastructure/postgres}
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3777
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 1020 -U test -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: inout-redis:7
    build: {context: ./infrastructure/redis}
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: ["redis-server", "--port", "1021", "--save", "", "--appendonly", "no"]
    networks: [test]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "1021", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-tests:
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@db-test:1020/inout_test
      DATABASE_URL: postgresql+asyncpg://test:test@db-test:1020/inout_test
      READ_DATABASE_URL: postgresql+asyncpg://test:test@db-test:1020/inout_test
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      REDIS_URL: redis://redis-test:1021/0
      TEST_REDIS_URL: redis://redis-test:1021/0
    networks: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  postgres-primary:
    networks: [app-db, identity-db, temporal-db]
    image: inout-postgres:17
    build: {context: ./infrastructure/postgres}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3777
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      # TCP excludes the temporary Unix-socket-only initialization server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 1020 -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # Existing populated databases require the explicit maintenance procedure.
  db-provision:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PROVISION_ADMIN_PASSWORD: ${POSTGRES_CURRENT_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      PROVISION_PORT: 1020
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate MIGRATION_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Generate KEYCLOAK_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
    volumes:
      - ./infrastructure/postgres/provision_database.py:/maintenance/provision_database.py:ro
    command: [python, /maintenance/provision_database.py, --apply]
    networks: [app-db]
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    networks: [cache]
    image: inout-redis:7
    build: {context: ./infrastructure/redis}
    user: redis
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      REDIS_QUOTA_PASSWORD: ${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Generate REDIS_GATEWAY_PASSWORD}
    entrypoint: [sh, /usr/local/bin/inout-start-redis.sh]
    volumes:
      - ./infrastructure/redis/start-redis.sh:/usr/local/bin/inout-start-redis.sh:ro
    tmpfs:
      - /run/inout-redis:uid=999,gid=1000,mode=0700
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_QUOTA_PASSWORD redis-cli -p 1021 --user inout-quota ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  keycloak:
    # Keep Keycloak on private app/database networks and the existing
    # non-internal gateway network for external OIDC provider callbacks.
    networks: [edge, web, identity-db]
    image: inout-keycloak:${KEYCLOAK_VERSION:-26.8.2}
    build:
      context: ./keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.8.2}
    # Database/health augmentation is cached in the image, rather than repeated
    # while the rest of the application is waiting for the identity provider.
    command: start --optimized --http-enabled=true --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres-primary:1020/inout
      - KC_DB_USERNAME=inout_keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?Generate KEYCLOAK_DB_PASSWORD}
      - KC_HTTP_PORT=1022
      - KC_HTTP_MANAGEMENT_PORT=1023
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - KEYCLOAK_PASSWORD_UPDATE_CLIENT_SECRET=${KEYCLOAK_PASSWORD_UPDATE_CLIENT_SECRET:-}
      - INOUT_APP_URL=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
      # Keep identity cookies on a separate host from the app; cookies ignore ports.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://auth.localhost:${KEYCLOAK_PORT:-1005}}
      # /admin stays blocked on the public listener; the separate admin
      # gateway below is loopback-bound and forwards to this internal host.
      - KC_HOSTNAME_ADMIN=${KEYCLOAK_ADMIN_ORIGIN:-http://auth.localhost:${KEYCLOAK_ADMIN_PORT:-1009}}
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-inout.json:/opt/keycloak/data/import/inout-realm.json:ro
    healthcheck:
      # Aggregate readiness can fail while individual body checks still say UP.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/1023; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r task_http_version task_health_status task_reason <&3; case \"$$task_http_version:$$task_health_status\" in HTTP/1.0:200|HTTP/1.1:200) exit 0;; *) exit 1;; esac"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      db-provision:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-admin:
    networks: [edge, web]
    image: inout-kong:${KONG_VERSION:-3.9.3}
    build:
      context: ./gateway
      args:
        KONG_VERSION: ${KONG_VERSION:-3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "0.0.0.0:1015"
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: "127.0.0.1:1017"
      KONG_PLUGINS: bundled,inout-terminal-identity,inout-rate-identity
      KONG_NGINX_MAIN_ENV: "INOUT_GATEWAY_REDIS_PASSWORD"
      INOUT_GATEWAY_REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Generate REDIS_GATEWAY_PASSWORD}
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 1m
      KONG_NGINX_HTTP_CLIENT_BODY_TIMEOUT: ${INOUT_UPLOAD_IDLE_TIMEOUT_SECONDS:-30}s
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 16k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 32k"
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 64k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "8 64k"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./gateway/plugins/inout-terminal-identity:/usr/local/share/lua/5.1/kong/plugins/inout-terminal-identity:ro
      - ./gateway/plugins/inout-rate-identity:/usr/local/share/lua/5.1/kong/plugins/inout-rate-identity:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-1009}:1015"
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend-init:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [app-db, workflow]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_migrator:${MIGRATION_DB_PASSWORD:?Generate MIGRATION_DB_PASSWORD}@postgres-primary:1020/inout
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - TEMPORAL_HOST=temporal:1024
    volumes:
      - ./infrastructure/postgres/provision_database.py:/maintenance/provision_database.py:ro
    # One idempotent bootstrap job: schema, reference data, then the durable
    # Temporal alert schedule. Keeping these together avoids a second exited
    # scheduler container after every deployment.
    command: ["sh", "-c", "alembic upgrade head && python /maintenance/provision_database.py --runtime-grants-only && python seed.py reference && python -m scheduler"]
    depends_on:
      db-provision:
        condition: service_completed_successfully
      temporal-namespace-init:
        condition: service_completed_successfully

  # Destructive, opt-in local fixture loader. Never starts with the normal app.
  demo-seed:
    profiles: [demo]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [app-db, identity-db]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_migrator:${MIGRATION_DB_PASSWORD:?Generate MIGRATION_DB_PASSWORD}@postgres-primary:1020/inout
      - KEYCLOAK_ADMIN_BASE=http://keycloak:1022
      - KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-setup-admin}
      - KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
      - DEMO_CREDENTIALS_PATH=/output/full-demo-accounts.csv
    volumes:
      - ./.local-test-accounts:/output
    command: ["python", "seed_full_demo.py", "--reset", "--provision-keycloak"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  python-api:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [web, app-db, cache, workflow, mail]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_app:${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}@postgres-primary:1020/inout
      - DATABASE_STATEMENT_CACHE_SIZE=${DATABASE_STATEMENT_CACHE_SIZE:-100}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - QUOTA_REDIS_URL=redis://inout-quota:${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}@redis:1021/0
      - EVENTS_REDIS_URL=redis://inout-events:${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}@redis:1021/0
      - TEMPORAL_HOST=temporal:1024
      - KONG_TERMINAL_SECRET=${KONG_TERMINAL_SECRET:-}
      - KONG_IDENTITY_SECRET=${KONG_IDENTITY_SECRET:?Generate KONG_IDENTITY_SECRET}
      - KEYCLOAK_ISSUER=${KEYCLOAK_PUBLIC_URL:-http://auth.localhost:${KEYCLOAK_PORT:-1005}}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1022/realms/inout
      - KEYCLOAK_ADMIN_BASE=http://keycloak:1022
      - KEYCLOAK_INVITE_CLIENT_ID=${KEYCLOAK_INVITE_CLIENT_ID:-inout-invitations}
      - KEYCLOAK_INVITE_CLIENT_SECRET=${KEYCLOAK_INVITE_CLIENT_SECRET:-}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-300}
      - KEYCLOAK_STEP_UP_SIGNING_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - INVITE_APP_BASE_URL=${AUTH_URL:-${INOUT_APP_URL:-http://app.localhost:${APP_PORT:-1008}}}
      - INVITE_TTL_SECONDS=${INVITE_TTL_SECONDS:-900}
      - INVITE_SMTP_HOST=${KEYCLOAK_SMTP_HOST:-}
      - INVITE_SMTP_PORT=${KEYCLOAK_SMTP_PORT:-587}
      - INVITE_SMTP_PROXY_HOST=mail-relay
      - INVITE_SMTP_PROXY_PORT=2525
      - INVITE_SMTP_FROM=${KEYCLOAK_SMTP_FROM:-}
      - INVITE_SMTP_DISPLAY_NAME=${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-InOut Management}
      - INVITE_SMTP_AUTH=${KEYCLOAK_SMTP_AUTH:-true}
      - INVITE_SMTP_USER=${KEYCLOAK_SMTP_USER:-}
      - INVITE_SMTP_PASSWORD=${KEYCLOAK_SMTP_PASSWORD:-}
      - INVITE_SMTP_STARTTLS=${KEYCLOAK_SMTP_STARTTLS:-true}
      - INVITE_SMTP_SSL=${KEYCLOAK_SMTP_SSL:-false}
      - PUBLIC_PORT=${PYTHON_API_PORT:-1002}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-262144}
      - DATA_BYTES_PER_MINUTE=${DATA_BYTES_PER_MINUTE:-67108864}
      - MAX_DATA_RESPONSE_BYTES=${MAX_DATA_RESPONSE_BYTES:-16777216}
      - MAX_SUBJECT_METADATA_BYTES=${MAX_SUBJECT_METADATA_BYTES:-16384}
      - DATA_SNAPSHOT_MAX_ROWS=${DATA_SNAPSHOT_MAX_ROWS:-10000}
      - DATA_ANALYTICS_MAX_ROWS=${DATA_ANALYTICS_MAX_ROWS:-50000}
      - BEHAVIOR_COOLDOWN_SECONDS=${BEHAVIOR_COOLDOWN_SECONDS:-60}
      - BEHAVIOR_FAILURES_PER_MINUTE=${BEHAVIOR_FAILURES_PER_MINUTE:-20}
      - BEHAVIOR_UNKNOWN_BARCODES_PER_MINUTE=${BEHAVIOR_UNKNOWN_BARCODES_PER_MINUTE:-30}
      - REQUEST_ADMISSION_CONCURRENCY=${REQUEST_ADMISSION_CONCURRENCY:-64}
      - REQUEST_BODY_DEADLINE_SECONDS=${REQUEST_BODY_DEADLINE_SECONDS:-30}
      - PRESENCE_STREAMS_PER_PRINCIPAL=${PRESENCE_STREAMS_PER_PRINCIPAL:-3}
      - PRESENCE_STREAMS_GLOBAL=${PRESENCE_STREAMS_GLOBAL:-128}
      - PRESENCE_LEASE_SECONDS=${PRESENCE_LEASE_SECONDS:-45}
      - QUOTA_REDIS_MAX_CONNECTIONS=${QUOTA_REDIS_MAX_CONNECTIONS:-64}
      - EVENTS_REDIS_MAX_CONNECTIONS=${EVENTS_REDIS_MAX_CONNECTIONS:-160}
      - ALERT_EVALUATION_MAX_SUBJECTS=${ALERT_EVALUATION_MAX_SUBJECTS:-5000}
      - ALERT_EVALUATION_MAX_MOVEMENTS=${ALERT_EVALUATION_MAX_MOVEMENTS:-50000}
      - ALERT_EVALUATION_MAX_ALERTS=${ALERT_EVALUATION_MAX_ALERTS:-50000}
      - ALERT_EVALUATION_MAX_RULES=${ALERT_EVALUATION_MAX_RULES:-1000}
      - CHECKPOINT_EVALUATION_MAX_CHECKPOINTS=${CHECKPOINT_EVALUATION_MAX_CHECKPOINTS:-10000}
      - CHECKPOINT_EVALUATION_MAX_ALERTS=${CHECKPOINT_EVALUATION_MAX_ALERTS:-10000}
      - ATTENDANCE_WORKDAYS=${ATTENDANCE_WORKDAYS:-0,1,2,3,4}
      - ATTENDANCE_CUTOFF_HOUR=${ATTENDANCE_CUTOFF_HOUR:-18}
      - ATTENDANCE_CUTOFF_MINUTE=${ATTENDANCE_CUTOFF_MINUTE:-0}
      - ATTENDANCE_GRACE_MINUTES=${ATTENDANCE_GRACE_MINUTES:-60}
      - ATTENDANCE_HOLIDAYS=${ATTENDANCE_HOLIDAYS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:1019/health/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    depends_on:
      postgres-primary:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
      mail-relay:
        condition: service_started
    restart: unless-stopped

  # The relay has a dedicated outbound network and a private application
  # network. It only opens TCP connections to the configured SMTP host/port;
  # the API itself remains on internal-only networks.
  mail-relay:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "mail_egress_relay.py"]
    environment:
      - MAIL_RELAY_UPSTREAM_HOST=${KEYCLOAK_SMTP_HOST:-}
      - MAIL_RELAY_UPSTREAM_PORT=${KEYCLOAK_SMTP_PORT:-587}
    networks: [mail, mail-egress]
    restart: unless-stopped

  temporal-worker:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [app-db, cache, workflow]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_app:${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}@postgres-primary:1020/inout
      - DATABASE_STATEMENT_CACHE_SIZE=${DATABASE_STATEMENT_CACHE_SIZE:-100}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - QUOTA_REDIS_URL=redis://inout-quota:${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}@redis:1021/0
      - EVENTS_REDIS_URL=redis://inout-events:${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}@redis:1021/0
      - TEMPORAL_HOST=temporal:1024
      - KEYCLOAK_ISSUER=${KEYCLOAK_PUBLIC_URL:-http://auth.localhost:${KEYCLOAK_PORT:-1005}}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1022/realms/inout
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - QUOTA_REDIS_MAX_CONNECTIONS=${QUOTA_REDIS_MAX_CONNECTIONS:-64}
      - EVENTS_REDIS_MAX_CONNECTIONS=${EVENTS_REDIS_MAX_CONNECTIONS:-160}
      - ALERT_EVALUATION_MAX_SUBJECTS=${ALERT_EVALUATION_MAX_SUBJECTS:-5000}
      - ALERT_EVALUATION_MAX_MOVEMENTS=${ALERT_EVALUATION_MAX_MOVEMENTS:-50000}
      - ALERT_EVALUATION_MAX_ALERTS=${ALERT_EVALUATION_MAX_ALERTS:-50000}
      - ALERT_EVALUATION_MAX_RULES=${ALERT_EVALUATION_MAX_RULES:-1000}
      - CHECKPOINT_EVALUATION_MAX_CHECKPOINTS=${CHECKPOINT_EVALUATION_MAX_CHECKPOINTS:-10000}
      - CHECKPOINT_EVALUATION_MAX_ALERTS=${CHECKPOINT_EVALUATION_MAX_ALERTS:-10000}
      - ATTENDANCE_WORKDAYS=${ATTENDANCE_WORKDAYS:-0,1,2,3,4}
      - ATTENDANCE_CUTOFF_HOUR=${ATTENDANCE_CUTOFF_HOUR:-18}
      - ATTENDANCE_CUTOFF_MINUTE=${ATTENDANCE_CUTOFF_MINUTE:-0}
      - ATTENDANCE_GRACE_MINUTES=${ATTENDANCE_GRACE_MINUTES:-60}
      - ATTENDANCE_HOLIDAYS=${ATTENDANCE_HOLIDAYS:-}
    command: ["python", "-m", "temporal_worker"]
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [web]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHON_API_URL=http://kong:1013
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - KEYCLOAK_CLIENT_ID=inout-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - PASSWORD_UPDATE_LOCK_API_URL=http://python-api:1019
      - KEYCLOAK_ISSUER=${KEYCLOAK_PUBLIC_URL:-http://auth.localhost:${KEYCLOAK_PORT:-1005}}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1022/realms/inout
      - KEYCLOAK_ISSUER_PUBLIC=${KEYCLOAK_PUBLIC_URL:-http://auth.localhost:${KEYCLOAK_PORT:-1005}}/realms/inout
      # Local sign-in links to the loopback-only Keycloak administration console.
      - KEYCLOAK_ADMIN_CONSOLE_URL=${KEYCLOAK_ADMIN_CONSOLE_URL:-http://auth.localhost:${KEYCLOAK_ADMIN_PORT:-1009}/admin/master/console/}
      # Container listeners are fixed in Kong and health checks. Only the
      # published APP_PORT may change; ignore legacy internal-port overrides.
      - PORT=1018
      - PUBLIC_PORT=${APP_PORT:-1008}
    # Next can initialize while the database, API and identity provider start.
    # Kong still waits for all four healthy upstreams before publishing traffic.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:1018/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # The official server no longer includes auto-setup. This scoped job accepts
  # only fresh 1.32 clusters or previously marked, verified 1.32 clusters.
  # Existing 1.26 data must follow the staged upgrade procedure before startup.
  temporal-schema-init:
    networks: [temporal-db]
    image: inout-temporal-maintenance:1.32.2
    build:
      context: ./infrastructure/temporal
      additional_contexts:
        backend: service:db-provision
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      SQL_HOST: postgres-primary
      SQL_PORT: 1020
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
    depends_on:
      db-provision:
        condition: service_completed_successfully

  temporal:
    networks: [temporal-db, workflow]
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      - DB=postgres12
      - DB_PORT=1020
      - POSTGRES_USER=inout_temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=postgres-primary
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/inout-dynamic.yaml
      # gRPC is reachable only by the designated workflow-network clients.
      - BIND_ON_IP=0.0.0.0
      - FRONTEND_GRPC_PORT=1024
      - FRONTEND_HTTP_PORT=1025
      - FRONTEND_MEMBERSHIP_PORT=1026
      - INTERNAL_FRONTEND_GRPC_PORT=1027
      - INTERNAL_FRONTEND_MEMBERSHIP_PORT=1028
      - MATCHING_GRPC_PORT=1029
      - MATCHING_MEMBERSHIP_PORT=1030
      - HISTORY_GRPC_PORT=1031
      - HISTORY_MEMBERSHIP_PORT=1032
      - WORKER_GRPC_PORT=1033
      - WORKER_MEMBERSHIP_PORT=1034
    volumes:
      - ./infrastructure/temporal/dynamicconfig.yaml:/etc/temporal/inout-dynamic.yaml:ro
    depends_on:
      temporal-schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  temporal-namespace-init:
    networks: [workflow]
    build: {context: ./backend}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      TEMPORAL_HOST: temporal:1024
    volumes:
      - ./infrastructure/temporal/bootstrap_namespace.py:/maintenance/bootstrap_namespace.py:ro
    command: [python, /maintenance/bootstrap_namespace.py]
    depends_on:
      temporal:
        # The pinned server image is minimal and does not provide netcat.
        # The bootstrap job below performs the actual gRPC health check.
        condition: service_started

  temporal-ui:
    networks: [workflow]
    image: temporalio/ui:2.56.1@sha256:584dd3408ab8333888d50b12d4a683e550e963409bf95fa2c9159d40d7cb825f
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    profiles: [observability]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-1007}:1035"
    environment:
      - TEMPORAL_ADDRESS=temporal:1024
      - TEMPORAL_UI_PORT=1035
      - TEMPORAL_CORS_ORIGINS=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
    # Local developer access only. Do not bind beyond loopback or use on a
    # shared host without an authenticated maintenance proxy.
    depends_on:
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    networks: [edge, monitoring]
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    profiles: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:1036
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-1010}:1036"
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-primary-data:
  prometheus-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    driver: bridge
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: ${SHARED_INGRESS_SUBNET:-172.30.250.0/29}
  web:
    internal: true
  mail:
    internal: true
  mail-egress:
    driver: bridge
  app-db:
    internal: true
  identity-db:
    internal: true
  temporal-db:
    internal: true
  cache:
    internal: true
  workflow:
    internal: true
  monitoring:
    internal: true
  test:
    internal: true
