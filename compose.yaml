# Kong owns the local HTTP listeners. App, API, and Keycloak have no host ports.
# For physical-terminal TLS, add compose.mtls.yaml with your own certificates.
services:
  kong:
    # Published loopback ports need a host-facing bridge. Upstreams stay private.
    networks: [edge, web, cache, monitoring]
    image: inout-kong:${KONG_VERSION:-3.9.3}
    build:
      context: ./gateway
      args:
        KONG_VERSION: ${KONG_VERSION:-3.9.3}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8002, 0.0.0.0:8005"
      KONG_ADMIN_LISTEN: "off"
      # Metrics are reachable only from private container networks; this port
      # is not published on the host or included in the public proxy listeners.
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PLUGINS: bundled,inout-terminal-identity,inout-rate-identity,inout-ingress-limit
      KONG_NGINX_MAIN_ENV: "INOUT_TERMINAL_SECRET; env INOUT_UPLOAD_DEADLINE_SECONDS; env INOUT_GATEWAY_IDENTITY_SECRET; env INOUT_GATEWAY_REDIS_PASSWORD"
      INOUT_UPLOAD_DEADLINE_SECONDS: ${INOUT_UPLOAD_DEADLINE_SECONDS:-30}
      INOUT_TERMINAL_SECRET: ${KONG_TERMINAL_SECRET:-}
      INOUT_GATEWAY_IDENTITY_SECRET: ${KONG_IDENTITY_SECRET:?Generate KONG_IDENTITY_SECRET}
      INOUT_GATEWAY_REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Generate REDIS_GATEWAY_PASSWORD}
      # Caller-supplied forwarded addresses cannot choose an ingress bucket.
      KONG_TRUSTED_IPS: ""
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 1m
      # Auth.js may chunk the session cookie across several request cookies.
      # Allow the gateway to accept the complete Cookie header on protected routes.
      KONG_NGINX_HTTP_CLIENT_HEADER_BUFFER_SIZE: 16k
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 32k"
      # Auth.js/Keycloak can return several large Set-Cookie and redirect
      # headers during login. The entire response header block (not each
      # cookie) must fit the first buffer, including session chunks >16 KiB.
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 64k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "8 64k"
      # Resolve upstream containers only after their health checks pass. This
      # avoids a first-request DNS failure when Docker has not registered the
      # app endpoint yet.
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
      - ./gateway/plugins/inout-terminal-identity:/usr/local/share/lua/5.1/kong/plugins/inout-terminal-identity:ro
      - ./gateway/plugins/inout-rate-identity:/usr/local/share/lua/5.1/kong/plugins/inout-rate-identity:ro
      - ./gateway/plugins/inout-ingress-limit:/usr/local/share/lua/5.1/kong/plugins/inout-ingress-limit:ro
    ports:
      - "127.0.0.1:${APP_PORT:-1008}:8000"
      - "127.0.0.1:${PYTHON_API_PORT:-1002}:8002"
      - "127.0.0.1:${KEYCLOAK_PORT:-1005}:8005"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    depends_on:
      app:
        condition: service_healthy
      python-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: inout-postgres:17
    build: {context: ./infrastructure/postgres}
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    environment:
      POSTGRES_DB: inout_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3777
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d inout_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: inout-redis:7
    build: {context: ./infrastructure/redis}
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [test]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-tests:
    profiles: [test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:ro
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      READ_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/inout_test
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-3000}
      REDIS_URL: redis://redis-test:6379/0
      TEST_REDIS_URL: redis://redis-test:6379/0
    networks: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  postgres-primary:
    networks: [app-db, identity-db, temporal-db]
    image: inout-postgres:17
    build: {context: ./infrastructure/postgres}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3777
    environment:
      - POSTGRES_DB=inout
      - POSTGRES_USER=inout
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      # TCP excludes the temporary Unix-socket-only initialization server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inout -d inout"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # Existing populated databases require the explicit maintenance procedure.
  db-provision:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PROVISION_ADMIN_PASSWORD: ${POSTGRES_CURRENT_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate MIGRATION_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Generate KEYCLOAK_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
    volumes:
      - ./infrastructure/postgres/provision_database.py:/maintenance/provision_database.py:ro
    command: [python, /maintenance/provision_database.py, --apply]
    networks: [app-db]
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    networks: [cache]
    image: inout-redis:7
    build: {context: ./infrastructure/redis}
    user: redis
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      REDIS_QUOTA_PASSWORD: ${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}
      REDIS_EVENTS_PASSWORD: ${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Generate REDIS_GATEWAY_PASSWORD}
    entrypoint: [sh, /usr/local/bin/inout-start-redis.sh]
    volumes:
      - ./infrastructure/redis/start-redis.sh:/usr/local/bin/inout-start-redis.sh:ro
    tmpfs:
      - /run/inout-redis:uid=999,gid=1000,mode=0700
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_QUOTA_PASSWORD redis-cli --user inout-quota ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  keycloak:
    networks: [web, identity-db]
    image: inout-keycloak:${KEYCLOAK_VERSION:-26.8.0}
    build:
      context: ./keycloak
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.8.0}
    # Database/health augmentation is cached in the image, rather than repeated
    # while the rest of the application is waiting for the identity provider.
    command: start --optimized --http-enabled=true --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak
      - KC_DB_URL=jdbc:postgresql://postgres-primary:5432/inout
      - KC_DB_USERNAME=inout_keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?Generate KEYCLOAK_DB_PASSWORD}
      - KC_HTTP_PORT=1105
      - KC_HEALTH_ENABLED=true
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - INOUT_APP_URL=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
      # Keep identity cookies on a separate host from the app; cookies ignore ports.
      - KC_HOSTNAME=http://auth.localhost:${KEYCLOAK_PORT:-1005}
      # The separate maintenance listener is enabled only with
      # compose.keycloak-admin.yaml; /admin is blocked on the public listener.
      - KC_HOSTNAME_ADMIN=http://auth.localhost:${KEYCLOAK_ADMIN_PORT:-1009}
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-inout.json:/opt/keycloak/data/import/inout-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s
    depends_on:
      db-provision:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-init:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [app-db, workflow]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_migrator:${MIGRATION_DB_PASSWORD:?Generate MIGRATION_DB_PASSWORD}@postgres-primary:5432/inout
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - TEMPORAL_HOST=temporal:7233
    volumes:
      - ./infrastructure/postgres/provision_database.py:/maintenance/provision_database.py:ro
    # One idempotent bootstrap job: schema, reference data, then the durable
    # Temporal alert schedule. Keeping these together avoids a second exited
    # scheduler container after every deployment.
    command: ["sh", "-c", "alembic upgrade head && python /maintenance/provision_database.py --runtime-grants-only && python seed.py reference && python -m scheduler"]
    depends_on:
      db-provision:
        condition: service_completed_successfully
      temporal-namespace-init:
        condition: service_completed_successfully

  python-api:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [web, app-db, cache, workflow]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_app:${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}@postgres-primary:5432/inout
      - DATABASE_STATEMENT_CACHE_SIZE=${DATABASE_STATEMENT_CACHE_SIZE:-100}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - QUOTA_REDIS_URL=redis://inout-quota:${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}@redis:6379/0
      - EVENTS_REDIS_URL=redis://inout-events:${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}@redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - KONG_TERMINAL_SECRET=${KONG_TERMINAL_SECRET:-}
      - KONG_IDENTITY_SECRET=${KONG_IDENTITY_SECRET:?Generate KONG_IDENTITY_SECRET}
      - KEYCLOAK_ISSUER=http://auth.localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_ADMIN_BASE=http://keycloak:1105
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-300}
      - KEYCLOAK_STEP_UP_SIGNING_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - PUBLIC_PORT=${PYTHON_API_PORT:-1002}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-262144}
      - DATA_BYTES_PER_MINUTE=${DATA_BYTES_PER_MINUTE:-67108864}
      - MAX_DATA_RESPONSE_BYTES=${MAX_DATA_RESPONSE_BYTES:-16777216}
      - MAX_SUBJECT_METADATA_BYTES=${MAX_SUBJECT_METADATA_BYTES:-16384}
      - DATA_SNAPSHOT_MAX_ROWS=${DATA_SNAPSHOT_MAX_ROWS:-10000}
      - DATA_ANALYTICS_MAX_ROWS=${DATA_ANALYTICS_MAX_ROWS:-50000}
      - BEHAVIOR_COOLDOWN_SECONDS=${BEHAVIOR_COOLDOWN_SECONDS:-60}
      - BEHAVIOR_FAILURES_PER_MINUTE=${BEHAVIOR_FAILURES_PER_MINUTE:-20}
      - BEHAVIOR_UNKNOWN_BARCODES_PER_MINUTE=${BEHAVIOR_UNKNOWN_BARCODES_PER_MINUTE:-30}
      - REQUEST_ADMISSION_CONCURRENCY=${REQUEST_ADMISSION_CONCURRENCY:-64}
      - REQUEST_BODY_DEADLINE_SECONDS=${REQUEST_BODY_DEADLINE_SECONDS:-30}
      - PRESENCE_STREAMS_PER_PRINCIPAL=${PRESENCE_STREAMS_PER_PRINCIPAL:-3}
      - PRESENCE_STREAMS_GLOBAL=${PRESENCE_STREAMS_GLOBAL:-128}
      - PRESENCE_LEASE_SECONDS=${PRESENCE_LEASE_SECONDS:-45}
      - QUOTA_REDIS_MAX_CONNECTIONS=${QUOTA_REDIS_MAX_CONNECTIONS:-64}
      - EVENTS_REDIS_MAX_CONNECTIONS=${EVENTS_REDIS_MAX_CONNECTIONS:-160}
      - ALERT_EVALUATION_MAX_SUBJECTS=${ALERT_EVALUATION_MAX_SUBJECTS:-5000}
      - ALERT_EVALUATION_MAX_MOVEMENTS=${ALERT_EVALUATION_MAX_MOVEMENTS:-50000}
      - ALERT_EVALUATION_MAX_ALERTS=${ALERT_EVALUATION_MAX_ALERTS:-50000}
      - ALERT_EVALUATION_MAX_RULES=${ALERT_EVALUATION_MAX_RULES:-1000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:1102/health/ready')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    depends_on:
      postgres-primary:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  temporal-worker:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [app-db, cache, workflow]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://inout_app:${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD}@postgres-primary:5432/inout
      - DATABASE_STATEMENT_CACHE_SIZE=${DATABASE_STATEMENT_CACHE_SIZE:-100}
      - DATABASE_CONNECT_TIMEOUT_SECONDS=${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      - DATABASE_STATEMENT_TIMEOUT_MS=${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      - DATABASE_LOCK_TIMEOUT_MS=${DATABASE_LOCK_TIMEOUT_MS:-3000}
      - QUOTA_REDIS_URL=redis://inout-quota:${REDIS_QUOTA_PASSWORD:?Generate REDIS_QUOTA_PASSWORD}@redis:6379/0
      - EVENTS_REDIS_URL=redis://inout-events:${REDIS_EVENTS_PASSWORD:?Generate REDIS_EVENTS_PASSWORD}@redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - KEYCLOAK_ISSUER=http://auth.localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-inout-frontend}
      - QUOTA_REDIS_MAX_CONNECTIONS=${QUOTA_REDIS_MAX_CONNECTIONS:-64}
      - EVENTS_REDIS_MAX_CONNECTIONS=${EVENTS_REDIS_MAX_CONNECTIONS:-160}
      - ALERT_EVALUATION_MAX_SUBJECTS=${ALERT_EVALUATION_MAX_SUBJECTS:-5000}
      - ALERT_EVALUATION_MAX_MOVEMENTS=${ALERT_EVALUATION_MAX_MOVEMENTS:-50000}
      - ALERT_EVALUATION_MAX_ALERTS=${ALERT_EVALUATION_MAX_ALERTS:-50000}
      - ALERT_EVALUATION_MAX_RULES=${ALERT_EVALUATION_MAX_RULES:-1000}
    command: ["python", "-m", "temporal_worker"]
    depends_on:
      backend-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [web]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHON_API_URL=http://kong:8002
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - KEYCLOAK_CLIENT_ID=inout-frontend
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      - KEYCLOAK_ISSUER=http://auth.localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - KEYCLOAK_JWKS_BASE=http://keycloak:1105/realms/inout
      - KEYCLOAK_ISSUER_PUBLIC=http://auth.localhost:${KEYCLOAK_PORT:-1005}/realms/inout
      - PORT=${APP_INTERNAL_PORT:-3000}
      - PUBLIC_PORT=${APP_PORT:-1008}
    # Next can initialize while the database, API and identity provider start.
    # Kong still waits for all four healthy upstreams before publishing traffic.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  # The official server no longer includes auto-setup. This scoped job accepts
  # only fresh 1.32 clusters or previously marked, verified 1.32 clusters.
  # Existing 1.26 data must follow the staged upgrade procedure before startup.
  temporal-schema-init:
    networks: [temporal-db]
    image: inout-temporal-maintenance:1.32.1
    build:
      context: ./infrastructure/temporal
      additional_contexts:
        backend: service:db-provision
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      SQL_HOST: postgres-primary
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
    depends_on:
      db-provision:
        condition: service_completed_successfully

  temporal:
    networks: [temporal-db, workflow]
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=inout_temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:?Generate TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=postgres-primary
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/inout-dynamic.yaml
      # gRPC is reachable only by the designated workflow-network clients.
      - BIND_ON_IP=0.0.0.0
    volumes:
      - ./infrastructure/temporal/dynamicconfig.yaml:/etc/temporal/inout-dynamic.yaml:ro
    depends_on:
      temporal-schema-init:
        condition: service_completed_successfully
    healthcheck:
      # This is liveness only; the SDK job below verifies gRPC and namespace readiness.
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  temporal-namespace-init:
    networks: [workflow]
    build: {context: ./backend}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      TEMPORAL_HOST: temporal:7233
    volumes:
      - ./infrastructure/temporal/bootstrap_namespace.py:/maintenance/bootstrap_namespace.py:ro
    command: [python, /maintenance/bootstrap_namespace.py]
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    networks: [workflow]
    image: temporalio/ui:2.55.0@sha256:3899d5cf749b5555c9f798d46f2423b1d6190ea391ca713db5d1bba961759e58
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    profiles: [observability]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=${AUTH_URL:-http://app.localhost:${APP_PORT:-1008}}
    # Local developer access only. Do not bind beyond loopback or use on a
    # shared host without an authenticated maintenance proxy.
    depends_on:
      temporal-namespace-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    networks: [monitoring]
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    profiles: [observability]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-primary-data:
  prometheus-data:

networks:
  edge:
    driver: bridge
  web:
    internal: true
  app-db:
    internal: true
  identity-db:
    internal: true
  temporal-db:
    internal: true
  cache:
    internal: true
  workflow:
    internal: true
  monitoring:
    internal: true
  test:
    internal: true
