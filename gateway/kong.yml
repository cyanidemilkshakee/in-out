_format_version: "3.0"
_transform: true

# Listener-specific routes preserve the existing app, API, and Keycloak URLs.
# Kong's Admin API is disabled; this file is the source of truth.
services:
  - name: inout-web
    id: 8c07b156-e8f2-4a30-a967-4c09c8df5945
    url: http://app:1018
    retries: 0
    read_timeout: 60000
    routes:
      - name: web-events
        expression: http.headers.inoutlistener == "1012" && http.path == "/api/presence"
        priority: 100
        strip_path: false
        preserve_host: true
        response_buffering: false
      - name: web
        expression: http.headers.inoutlistener == "1012"
        priority: 10
        strip_path: false
        preserve_host: true
    plugins:
      # Use a separate shared socket-peer budget for browser app traffic.
      - name: rate-limiting
        config:
          minute: 1800
          limit_by: ip
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: &gateway-redis
            host: redis
            port: 1021
            database: 0
            timeout: 2000
            username: inout-gateway
            password: "{vault://env/inout-gateway-redis-password}"

  # Sign-in, password updates and callback POSTs share one peer allowance.
  # GET CSRF/provider requests, OAuth callbacks and ordinary pages remain above.
  - name: inout-login-actions
    id: ec743912-240d-464d-9b1e-491e44d2058a
    url: http://app:1018
    retries: 0
    read_timeout: 60000
    routes:
      - name: login-actions
        expression: >-
          http.headers.inoutlistener == "1012" && http.method == "POST" &&
          (http.path ~ r#"^/api/auth/(callback|signin)(/.*)?$"# ||
           http.path ~ r#"^/api/auth/password/update/?$"# ||
           http.path ~ r#"^/api/auth/profile/complete/?$"# ||
           http.path ~ r#"^/login/?$"#)
        priority: 250
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 3
          minute: 10
          limit_by: ip
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  # Invitation acceptance is public and uses a bearer link token; keep failed
  # guesses tightly rate-limited before they reach the app.
  - name: inout-invitation-acceptance
    id: 4d18a55e-1b82-4da4-951f-2e4d932e5c34
    url: http://app:1018
    retries: 0
    read_timeout: 60000
    routes:
      - name: invitation-acceptance
        expression: >-
          http.headers.inoutlistener == "1012" && http.method == "POST" &&
          http.path == "/api/invitations/accept"
        priority: 260
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 2
          minute: 10
          limit_by: ip
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  # Sending mail-bearing invites has a separate budget from ordinary admin
  # requests, in addition to the authenticated app checks.
  - name: inout-invitation-management
    id: 4e29b66f-2c93-4e5f-a62f-3f5e4d6f7a81
    url: http://app:1018
    retries: 0
    read_timeout: 60000
    routes:
      - name: invitation-management
        expression: >-
          http.headers.inoutlistener == "1012" && http.method == "POST" &&
          http.path == "/api/invitations"
        priority: 255
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 3
          minute: 30
          limit_by: ip
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  - name: inout-api
    id: 49fa490b-bd8a-48d2-9655-5b2bf09cbe20
    url: http://python-api:1019
    retries: 0
    read_timeout: 60000
    routes:
      - name: api-events
        expression: http.headers.inoutlistener == "1013" && http.path == "/v1/presence/stream"
        priority: 110
        strip_path: false
        preserve_host: true
        response_buffering: false
      # This endpoint authenticates a single-use invitation token instead of
      # a user session; the custom identity plugin explicitly allows this POST.
      - name: api-invitation-acceptance
        id: 338632e6-b2e6-4db3-9414-55d09f65be42
        expression: >-
          http.headers.inoutlistener == "1013" && http.method == "POST" &&
          http.path == "/v1/invitations/accept"
        priority: 220
        strip_path: false
        preserve_host: true
      # Public health/docs and CORS preflight requests don't have a verified
      # account credential, so give this route its own IP-based stock limit.
      - name: api-public
        id: 7b53e12a-9c17-42b9-b935-267e261bab7f
        expression: >-
          http.headers.inoutlistener == "1013" &&
          (http.method == "OPTIONS" ||
           ((http.method == "GET" || http.method == "HEAD") &&
            (http.path == "/" || http.path == "/health/live" ||
             http.path == "/health/ready" || http.path == "/docs" ||
             http.path == "/docs/oauth2-redirect" || http.path == "/redoc" ||
             http.path == "/openapi.json")))
        priority: 150
        strip_path: false
        preserve_host: true
      - name: api
        expression: http.headers.inoutlistener == "1013"
        priority: 20
        strip_path: false
        preserve_host: true
      - name: terminal-mtls
        expression: >-
          http.headers.inoutlistener == "1016" &&
          (http.path == "/v1/scans" || http.path == "/v1/scans/" ||
           http.path == "/v1/terminal/heartbeat/mtls")
        protocols: [https]
        priority: 120
        strip_path: false
        preserve_host: true
    plugins:
      - &api-body-limit
        name: request-size-limiting
        config:
          allowed_payload_size: 256
          size_unit: kilobytes
          require_content_length: false
      - name: rate-limiting
        config:
          minute: 300
          limit_by: credential
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  # One service per operation group shares its allowance across every matching
  # endpoint. Selecting another permission/review route cannot reset the budget.
  - name: inout-permission-actions
    id: c3eabdbc-72fa-457d-aedb-351a75c44f0a
    url: http://python-api:1019
    retries: 0
    read_timeout: 60000
    routes:
      - name: permission-actions
        expression: >-
          http.headers.inoutlistener == "1013" &&
          (http.method == "POST" || http.method == "PUT" || http.method == "PATCH" || http.method == "DELETE") &&
          (http.path ~ r#"^/v1/permissions/grant/?$"# ||
           http.path ~ r#"^/v1/permission-requests/?$"# ||
           http.path ~ r#"^/v1/registry/subjects/?$"# ||
           http.path ~ r#"^/v1/registry/subjects/[^/]+/?$"# ||
           http.path ~ r#"^/v1/alerts/[^/]+/review/?$"# ||
           http.path ~ r#"^/v1/permission-requests/[^/]+/decide/?$"# ||
           http.path ~ r#"^/v1/terminal/manual-reviews/?$"#)
        priority: 200
        strip_path: false
        preserve_host: true
    plugins:
      - *api-body-limit
      - name: rate-limiting
        config:
          second: 10
          minute: 60
          limit_by: credential
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  - name: inout-user-actions
    id: 452acb5b-8f4a-4bd9-a9d2-efb05daa72a4
    url: http://python-api:1019
    retries: 0
    read_timeout: 60000
    routes:
      - name: user-actions
        expression: >-
          http.headers.inoutlistener == "1013" &&
          (http.method == "POST" || http.method == "PUT" || http.method == "PATCH" || http.method == "DELETE") &&
          (http.path ~ r#"^/v1/keycloak/users(/.*)?$"# ||
           http.path ~ r#"^/v1/checkpoints/?$"#)
        priority: 200
        strip_path: false
        preserve_host: true
    plugins:
      - *api-body-limit
      - name: rate-limiting
        config:
          second: 5
          minute: 20
          limit_by: credential
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  - name: inout-alert-actions
    id: 3db460ad-6e07-4b7b-9715-af0ab387f494
    url: http://python-api:1019
    retries: 0
    read_timeout: 60000
    routes:
      - name: alert-actions
        expression: >-
          http.headers.inoutlistener == "1013" &&
          (http.method == "POST" || http.method == "PUT" || http.method == "PATCH" || http.method == "DELETE") &&
          (http.path ~ r#"^/v1/alerts/evaluate/?$"# ||
           http.path ~ r#"^/v1/alert-warnings/[^/]+/reset/?$"# ||
           http.path ~ r#"^/v1/alerts/[^/]+/release-entry-restriction/?$"# ||
           http.path ~ r#"^/v1/alert-rule-assignments/[^/]+/?$"#)
        priority: 200
        strip_path: false
        preserve_host: true
    plugins:
      - *api-body-limit
      - name: rate-limiting
        config:
          second: 5
          minute: 20
          limit_by: credential
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

  - name: inout-identity
    id: 73f42aab-f727-4a18-9440-8c420bac460c
    url: http://keycloak:1022
    retries: 0
    routes:
      - name: identity
        id: 85140fbf-0405-4ce3-86bd-a4a3a9f6da74
        expression: http.headers.inoutlistener == "1014"
        priority: 30
        strip_path: false
        preserve_host: true
      # This socket is absent unless the operator enables the maintenance
      # overlay. The plugin uses the actual socket, never a supplied header.
      - name: identity-maintenance
        expression: http.headers.inoutlistener == "1015"
        priority: 40
        strip_path: false
        preserve_host: true
  # Actual password, OTP, recovery and other stock Keycloak form submissions.
  # Realm/action/query changes share one socket-peer budget across gateways.
  - name: inout-identity-login-actions
    id: 15a4c2f8-2a8f-4ae9-a244-3fe92d8bb670
    url: http://keycloak:1022
    retries: 0
    routes:
      - name: identity-login-actions
        expression: >-
          http.headers.inoutlistener == "1014" && http.method == "POST" &&
          http.path ~ r#"^/realms/[^/]+/login-actions(/.*)?$"#
        priority: 250
        strip_path: false
        preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          second: 5
          minute: 60
          limit_by: ip
          policy: redis
          sync_rate: -1
          fault_tolerant: false
          redis: *gateway-redis

plugins:
  # Direct route-scoped built-in limiters keep public identity traffic separate
  # from the maintenance socket on the same Keycloak service.
  - name: rate-limiting
    id: 618b4cb7-a841-4b83-9d88-a0f50d0c72b0
    route:
      id: 85140fbf-0405-4ce3-86bd-a4a3a9f6da74
      protocols: [http]
      expression: 'http.headers.inoutlistener == "1014"'
    config:
      minute: 600
      limit_by: ip
      policy: redis
      sync_rate: -1
      fault_tolerant: false
      redis: *gateway-redis
  # Public API/docs and CORS preflight have no verified credential to limit by.
  - name: rate-limiting
    id: 730bf6a6-0d8d-49b4-a4a1-ed317a8f37a6
    route:
      id: 7b53e12a-9c17-42b9-b935-267e261bab7f
      protocols: [http]
      expression: >-
        http.headers.inoutlistener == "1013" &&
        (http.method == "OPTIONS" ||
         ((http.method == "GET" || http.method == "HEAD") &&
          (http.path == "/" || http.path == "/health/live" ||
           http.path == "/health/ready" || http.path == "/docs" ||
           http.path == "/docs/oauth2-redirect" || http.path == "/redoc" ||
           http.path == "/openapi.json")))
    config:
      minute: 6000
      limit_by: ip
      policy: redis
      sync_rate: -1
      fault_tolerant: false
      redis: *gateway-redis
  # Invitation acceptance carries a high-entropy link token rather than a
  # verified bearer, so also budget the API transport independently.
  - name: rate-limiting
    id: 05ac4731-f8cb-4614-9420-cb7dfd93c40f
    route:
      id: 338632e6-b2e6-4db3-9414-55d09f65be42
      protocols: [http]
      expression: >-
        http.headers.inoutlistener == "1013" && http.method == "POST" &&
        http.path == "/v1/invitations/accept"
    config:
      minute: 100
      limit_by: ip
      policy: redis
      sync_rate: -1
      fault_tolerant: false
      redis: *gateway-redis
  - name: inout-terminal-identity
  - name: inout-rate-identity
    config:
      identity_url: http://python-api:1019/internal/gateway/identity
      cache_ttl: 30
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  # Scraped through the private Status API, never through a public proxy route.
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      per_consumer: false
