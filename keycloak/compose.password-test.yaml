# Disposable native password API fixture. Combine with compose.test.yaml;
# never combine this file with the application's compose.yaml.
services:
  provision:
    image: inout-native-password-runtime
  tests:
    image: inout-native-password-runtime
  keycloak:
    environment:
      KEYCLOAK_PASSWORD_UPDATE_CLIENT_SECRET: isolated-password-updates-client-000000000000
  kong:
    networks:
      default: {}
      password-test-edge: {}
    ports:
      - '127.0.0.1:1098:1014'
      - '127.0.0.1:1099:1015'
networks:
  password-test-edge:
    ipam:
      config:
        - subnet: ${PASSWORD_TEST_EDGE_SUBNET:-10.250.245.0/24}
  default:
    ipam:
      config:
        - subnet: ${PASSWORD_TEST_SUBNET:-10.250.244.0/24}
